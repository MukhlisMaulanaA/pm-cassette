<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Cassette</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <!-- HEADER VISIT (READ-ONLY) -->
    <section id="visitHeader" class="card">
      <h2>Visit Information</h2>

      <div class="visit-row">
        <span class="label">PKT</span>
        <span id="visit-pkt">-</span>
      </div>

      <div class="visit-row">
        <span class="label">Visit Date</span>
        <span id="visit-date">-</span>
      </div>

      <div class="visit-row">
        <span class="label">Bank</span>
        <span id="visit-bank">-</span>
      </div>

      <div class="visit-row">
        <span class="label">Engineer</span>
        <span id="visit-engineer">-</span>
      </div>

      <div class="visit-row">
        <span class="label">Group</span>
        <span id="visit-group">-</span>
      </div>

      <div class="visit-row">
        <span class="label">OK</span>
        <span id="visit-ok">-</span>
      </div>

      <div class="visit-row">
        <span class="label">NG</span>
        <span id="visit-ng">-</span>
      </div>

      <div class="visit-row">
        <span class="label">Total NG + OK</span>
        <span id="visit-total"></span>
      </div>

    </section>

    <!-- FORM PM CASSETTE -->
    <section class="card">
      <h2>Input PM Cassette</h2>

      <form id="pm-form">
        <label>
          RC Type
          <select id="cassetteType" required>
            <option value="">-- Pilih --</option>
            <option value="RC60">RC60</option>
            <option value="RJC">RJC</option>
          </select>
        </label>

        <label>
          Serial Number
          <div style="display:flex; gap:6px;">
            <input type="text" id="prefix" readonly style="width:90px;" />
            <input type="number" id="serialNumber" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6);"/>
          </div>
        </label>

        <label>
          Production Month
          <select id="productionMonth" required>
            <option value="">-- Pilih --</option>
            <option>Jan</option>
            <option>Feb</option>
            <option>Mar</option>
            <option>Apr</option>
            <option>May</option>
            <option>Jun</option>
            <option>Jul</option>
            <option>Aug</option>
            <option>Sep</option>
            <option>Oct</option>
            <option>Nov</option>
            <option>Dec</option>
          </select>
        </label>

        <label>
          Production Year
          <select id="productionYear" required>
            <option value="">-- Pilih --</option>
          </select>
        </label>

        <label>
          Revision
          <input type="number" id="revision" />
        </label>

        <label>
          Action
          <input
            id="action"
            list="actionSuggestions"
            placeholder="Pilih atau ketik action..."
            required
          >
          <datalist id="actionSuggestions">
            <option value="Check & Clean"></option>
            <option value="Stacksheet Meleleh"></option>
            <option value="Sensor Mika Retak/ Pecah"></option>
          </datalist>
        </label>


        <label>
          Status
          <select id="status" required>
            <option value="">-- Pilih --</option>
            <option value="OK">OK</option>
            <option value="NG">NG</option>
          </select>
        </label>

        <input type="hidden" id="editId" />
        <button type="submit" id="pm-submit-button">Add</button>
      </form>
    </section>

    <section class="table-section">
      <h3>PM Cassette List</h3>

      <table id="pmTable">
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Bank</th>
            <th>PKT</th>
            <th>Group Area</th>
            <th>RC / RJC / Retract</th>
            <th>SN CST</th>
            <th>Bulan / Tahun Produksi</th>
            <th>Revisi Cassete</th>
            <th>Action</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="pm-table-body"></tbody>
      </table>
      <button id="export-xlsx" class="btn-export">
        Export Report
      </button>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/pm.js"></script>
</body>

</html>
